name: Update data and deploy

# 1日1回 apr.json を更新し、GitHub Pages に公開する。
# main へのpush（画面の修正など）や手動実行（Actions → Run workflow）でも公開し直す。
#
# 限定公開の切り替えは GitHub の設定だけで行う（コードの変更は不要）:
#   Settings → Secrets and variables → Actions
#     Secrets   ACCESS_CODE = アクセスコード
#     Variables ACCESS_GATE = on / off
#   変更後、すぐ反映したいときは Actions → このワークフロー → Run workflow
on:
  schedule:
    - cron: "20 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# 権限はジョブごとに必要な分だけ与える
permissions: {}

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # apr.json のコミットに必要
    steps:
      - uses: actions/checkout@v5

      # ランナー標準の python3 を使う（標準ライブラリのみで動くので setup-python は不要）
      - name: Test
        run: python3 -m unittest discover -s tests

      - name: Build apr.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build-apr.py -o apr.json

      # GITHUB_TOKEN による push では、このワークフローは再度起動しない
      - name: Commit if changed
        run: |
          if git diff --quiet -- apr.json; then
            echo "変更なし（新しいエポックがまだ確定していない）"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apr.json
          git commit -m "chore: update apr.json ($(python3 -c "import json;d=json.load(open('apr.json'));print('epoch %d-%d' % (d['epochs'][0], d['epochs'][-1]))"))"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write           # GitHub Pages への公開に必要
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # update ジョブで追加されたコミットも含めて公開する

      - name: Build site
        env:
          ACCESS_GATE: ${{ vars.ACCESS_GATE }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: python3 scripts/build_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
