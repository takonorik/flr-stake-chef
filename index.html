<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flare Stake Chef</title>
<meta name="theme-color" content="#FFE3EB">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E62058;--pink-deep:#B3134A;--pink-soft:#FFE3EB;--pink-tint:#FFF0F4;
  --bg:#FFF8FA;--surface:#FFFFFF;--text:#141016;--muted:#6F6572;--line:#141016;
  --shadow:#141016;--shadow-best:#E62058;--field:#FFF0F4;
  --hero-bg:radial-gradient(circle at 88% 8%,#FF9AB6 0,transparent 42%),radial-gradient(circle at 6% 100%,#FFC2D4 0,transparent 45%),#FFE3EB;
  --ok:#0F6E56;--warn:#B3134A;
  --sans:'Inter','Noto Sans JP',sans-serif;--mono:'JetBrains Mono',monospace;
}
@media (prefers-color-scheme:dark){:root{
  --pink-soft:#3A1826;--pink-tint:#24161D;--bg:#120E14;--surface:#1C161F;--text:#F6EEF2;--muted:#B3A6B0;
  --line:#F6EEF2;--shadow:#E62058;--shadow-best:#FF6A95;--field:#281D26;
  --hero-bg:radial-gradient(circle at 88% 8%,rgba(230,32,88,.75) 0,transparent 45%),radial-gradient(circle at 6% 100%,rgba(255,106,149,.35) 0,transparent 42%),#1B1320;
  --ok:#5DCAA5;--warn:#FF8FB0;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* hero */
.hero{background:var(--hero-bg);border-radius:0 0 36px 36px;padding:22px 16px 84px}
.hero-in{max-width:720px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.2rem;letter-spacing:-.03em}
.brand b{color:var(--pink)}
.mark{flex-shrink:0}
.for-flr{font-size:.6rem;font-weight:900;letter-spacing:.08em;border:2px solid var(--line);border-radius:99px;padding:1px 7px;background:var(--surface)}
.catch{font-size:clamp(1.45rem,4.6vw,2rem);font-weight:900;line-height:1.35;letter-spacing:-.01em;margin:22px 0 8px}
.catch .nw{white-space:nowrap}
.catch em{font-style:normal;background:var(--pink);color:#fff;padding:0 .3em;border-radius:8px;white-space:nowrap}
.lead{font-size:.8rem;font-weight:500;color:var(--muted)}
.lang-toggle{display:flex;border:2px solid var(--line);border-radius:99px;overflow:hidden;font-size:.7rem;font-weight:800;cursor:pointer;user-select:none;background:var(--surface)}
.lang-toggle span{padding:4px 10px;color:var(--muted)}
.lang-toggle span.active{background:var(--text);color:var(--bg)}

/* layout */
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
.panel{position:relative;margin-top:-60px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px;box-shadow:6px 6px 0 var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
@media(max-width:540px){.grid2{grid-template-columns:minmax(0,1fr)}.catch{font-size:1.35rem}.panel{padding:14px}}
.field{min-width:0}
#calLabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{display:block;font-size:.68rem;font-weight:800;color:var(--pink);margin-bottom:6px}
.label-hint{font-weight:500;color:var(--muted);margin-left:6px}
.field{background:var(--field);border-radius:16px;padding:10px 14px;border:2px solid transparent;transition:border-color .15s}
.field:focus-within,.field:hover{border-color:var(--pink)}
.iw{display:flex;align-items:center;gap:8px}
.iw input::placeholder{color:var(--muted);opacity:.55;font-weight:700}
.iw input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:800 1.2rem var(--sans);font-variant-numeric:tabular-nums;outline:none}
.unit{font-size:.75rem;font-weight:800;color:var(--pink)}
.cal-display{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:800;font-size:1.05rem;min-height:1.75rem}
.cal-icon{font-size:1rem}
.btn{width:100%;padding:15px;margin-top:14px;background:var(--text);color:var(--bg);border:2px solid var(--line);border-radius:16px;font:900 .95rem var(--sans);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:hover{box-shadow:4px 4px 0 var(--pink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.7;cursor:wait}

/* calendar */
.cal-popup{display:none;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.cal-popup.open{display:block}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-btn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-size:1.1rem;cursor:pointer}
.cal-nav-btn:hover{background:var(--pink-soft)}
.cal-month-lbl{font-weight:800}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px}
.cal-dow span{font-size:.66rem;font-weight:700;color:var(--muted);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{height:36px;border-radius:10px;border:0;background:transparent;color:var(--text);font:700 .8rem var(--sans);cursor:pointer}
.cal-day:hover:not(.disabled):not(.empty){background:var(--pink-soft);color:var(--pink)}
.cal-day.selected{background:var(--pink);color:#fff}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--pink-soft)}
.cal-day.disabled{color:var(--muted);opacity:.35;cursor:not-allowed}
.cal-day.empty{cursor:default}
.cal-day.other{color:var(--muted)}
.cal-day.other:not(.disabled){font-weight:600}
.cal-hint{font-size:.68rem;color:var(--muted);margin-top:8px;text-align:center}

/* conditions */
.condition-box{background:var(--pink-tint);border-radius:16px;padding:12px 14px}
.cond-title{font-size:.68rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.cond-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.cond-list li{font-size:.78rem;font-weight:500;padding-left:18px;position:relative}
.cond-list li::before{content:"✓";position:absolute;left:0;color:var(--pink);font-weight:900}
.opt-row{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding-top:10px;border-top:2px dashed var(--pink-soft);font-size:.76rem;font-weight:700;color:var(--text);cursor:pointer;line-height:1.5}
.opt-row input{margin-top:3px;accent-color:var(--pink);flex-shrink:0;width:16px;height:16px}
.opt-row small{display:block;color:var(--muted);font-size:.68rem;font-weight:500}

/* notes */
.data-note{font-size:.66rem;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}
.data-note a{color:var(--muted)}
.stale-warn{display:none;margin-top:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--pink);background:var(--pink-soft);color:var(--warn);font-size:.74rem;font-weight:700;text-align:center;line-height:1.5}
.stale-warn.on{display:block}

/* results */
.rh{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.rt{font-size:1.05rem;font-weight:900}
.rc{font-size:.8rem;font-weight:800;color:var(--pink)}
.summary{font-size:.76rem;color:var(--muted);line-height:1.7;margin:0 4px 12px}
.claim-note{display:none;border:2px dashed var(--pink);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:.74rem;line-height:1.7;background:var(--pink-tint)}
.claim-note.on{display:block}
.claim-note summary{cursor:pointer;font-weight:900;color:var(--text);list-style:none}
.claim-note summary::-webkit-details-marker{display:none}
.claim-note summary::after{content:' ▸';color:var(--pink)}
.claim-note[open] summary::after{content:' ▾'}
.claim-note p{margin-top:6px}
.vlist{display:flex;flex-direction:column;gap:16px}
.none-msg{color:var(--muted);font-size:.85rem;padding:24px 0;text-align:center}

/* validator card */
.vc{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:5px 5px 0 var(--shadow);animation:cin .35s ease both}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vc.best{box-shadow:5px 5px 0 var(--shadow-best);background:var(--pink-tint)}
.vhd{display:flex;align-items:center;gap:10px}
.rb{width:36px;height:36px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;font-weight:900;background:var(--pink-soft);color:var(--pink);border:2px solid var(--line)}
.vc.best .rb{background:var(--pink);color:#fff}
.vname{flex:1;min-width:0;font-weight:900;font-size:1.08rem;overflow-wrap:anywhere}
.mb{flex-shrink:0;font-size:.62rem;font-weight:900;letter-spacing:.05em;background:var(--pink);color:#fff;border-radius:99px;padding:4px 10px;cursor:help}
.aprrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 0 10px}
.apr{font-size:2.7rem;font-weight:900;line-height:.95;cursor:help}
.apr small{font-size:1rem;margin-left:1px}
.apr-lbl{font-size:.66rem;font-weight:800;color:var(--muted);margin-top:4px}
.est{text-align:right;font-size:.7rem;font-weight:700;color:var(--muted)}
.est b{display:block;font-size:1.08rem;color:var(--text)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;border:2px solid var(--line);background:var(--surface)}
.bar i{display:block;height:100%}
.bar .bv{background:var(--text)}
.bar .bm{background:var(--pink)}
.bar-cap{font-size:.64rem;font-weight:800;color:var(--muted);margin:0 2px 4px}
.leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.74rem;font-weight:800;margin:6px 2px 12px}
.leg .lv::before,.leg .lm::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.leg .lv::before{background:var(--text)}
.leg .lm{color:var(--pink)}
.leg .lm::before{background:var(--pink)}
.leg .plus{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);border:1.5px solid var(--pink-soft);color:var(--text)}
.tg{color:var(--ok)}
.tb{border-style:dashed;border-color:var(--muted)}
.tr{background:var(--pink-soft);border-color:var(--pink);color:var(--warn)}
.to{border-color:var(--pink);color:var(--pink)}
.tu{background:var(--text);border-color:var(--text);color:var(--bg)}
.node-block-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:.7rem;font-weight:800;color:var(--text);margin:0 2px 6px}
.node-block-label a{color:var(--pink);font-size:.68rem;text-decoration:none;white-space:nowrap}
.node-block-label a:hover{text-decoration:underline}
.node-id-row{display:flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:6px 6px 6px 14px}
.node-id-text{flex:1;font:700 .95rem var(--mono);letter-spacing:.04em;cursor:pointer}
.copy-btn{flex-shrink:0;border:2px solid var(--line);border-radius:10px;padding:7px 14px;background:var(--pink-soft);color:var(--text);font:900 .75rem var(--sans);cursor:pointer;transition:transform .1s}
.copy-btn:active{transform:scale(.96)}
.copy-btn.ok{background:var(--pink);color:#fff}
.node-full{font:500 .62rem var(--mono);color:var(--muted);margin:6px 2px 0;word-break:break-all}
.more-btn{width:100%;margin-top:6px;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);font:900 .85rem var(--sans);cursor:pointer;box-shadow:4px 4px 0 var(--shadow)}
.more-btn:active{transform:translate(2px,2px);box-shadow:none}

/* app bar (sticky) + tabs */
.appbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:2px solid var(--line)}
.appbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.appbar .brand{flex:1;min-width:0}
.tabs{display:flex;gap:4px;padding:4px;border:2px solid var(--line);border-radius:99px;background:var(--surface)}
.tabs button{border:0;border-radius:99px;padding:7px 16px;background:transparent;color:var(--muted);font:800 .82rem var(--sans);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--pink);color:#fff}
.tabs .ti{width:20px;height:20px;flex-shrink:0}
@media(max-width:720px){
  .appbar-in{flex-wrap:wrap;row-gap:8px}
  .tabs{order:3;width:100%}
  .tabs button{flex:1;justify-content:center}
}
.hero{padding-top:26px}
.pane[hidden]{display:none}

/* desktop: 左に検索フォーム（追従）、右に結果 */
.hero-in{max-width:1180px}
.wrap{max-width:1180px}
.col-results{min-width:0}
.empty-state{display:none}
@media(min-width:1024px){
  .layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start}
  .layout>.panel{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
  .layout>.panel .grid2{grid-template-columns:minmax(0,1fr)}
  .col-results{margin-top:-60px}
  .col-results .results{margin-top:0}
  .results{margin-top:0}
  .empty-state{display:block;border:2px dashed var(--pink);border-radius:26px;padding:28px;background:var(--pink-tint)}
  .empty-state.off{display:none}
}
.es-mark{width:56px;height:56px;margin-bottom:10px}
.es-title{font-weight:900;font-size:1.05rem;margin-bottom:10px}
.es-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.es-list li{font-size:.82rem;font-weight:500;padding-left:18px;position:relative;line-height:1.6}
.es-list li::before{content:"→";position:absolute;left:0;color:var(--pink);font-weight:900}
.es-list b{font-weight:900}
.results{display:none;margin-top:28px}
.results.on{display:block}

.results{scroll-margin-top:120px}
.tabs svg{width:22px;height:22px;flex-shrink:0}
.es-mark svg{width:56px;height:56px}
.node-id-text.addr{font-size:.78rem;letter-spacing:0;word-break:break-all}

/* footer */
.foot{margin-top:40px;text-align:center}
.credit{font-size:.74rem;color:var(--muted)}
.credit a{color:var(--pink);font-weight:800;text-decoration:none}
.disclaimer{margin-top:10px}
.disc-toggle{background:none;border:0;font:700 .72rem var(--sans);color:var(--muted);cursor:pointer;padding:4px 8px}
.disc-toggle:hover{color:var(--pink)}
.disc-toggle .disc-arrow{display:inline-block;transition:transform .25s;margin-right:4px;font-size:.6rem}
.disc-toggle.open .disc-arrow{transform:rotate(90deg)}
.disc-body{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .3s ease}
.disc-body.open{max-height:1000px;opacity:1}
.disc-inner{margin-top:8px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 18px}
.disc-inner ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.disc-inner li{font-size:.72rem;color:var(--muted);line-height:1.65;padding-left:16px;position:relative}
.disc-inner li::before{content:"・";position:absolute;left:0;color:var(--pink);font-weight:900}
.disc-inner a{color:var(--pink);font-weight:700}
</style>
</head>
<body>
<div class="appbar"><div class="appbar-in">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true"><g transform="translate(0 3)"><path d="M3.8 16.6C3.4 11.2 8.2 7.4 14.8 7.1 21.2 6.8 28 8.8 28.4 14.8 28.8 20.6 24.6 25.2 18 25.6 14.6 25.8 13 23.9 10.6 24.1 6.6 24.4 4.1 21.2 3.8 16.6Z" fill="#FFD6E1" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round"/><path transform="translate(16.2 16.3) scale(.76) translate(-16.2 -16.3)" d="M3.8 16.6C3.4 11.2 8.2 7.4 14.8 7.1 21.2 6.8 28 8.8 28.4 14.8 28.8 20.6 24.6 25.2 18 25.6 14.6 25.8 13 23.9 10.6 24.1 6.6 24.4 4.1 21.2 3.8 16.6Z" fill="#E62058"/><path d="M9.6 17.4 13.8 13.2M12.2 21 18.4 14.8M16.8 22.4 20.8 18.4" stroke="#B3134A" stroke-width="1.6" stroke-linecap="round"/></g><g transform="rotate(14 22 7)"><g fill="var(--line)"><circle cx="18.6" cy="6.4" r="3.4"/><circle cx="22" cy="4.4" r="3.9"/><circle cx="25.4" cy="6.4" r="3.4"/></g><g fill="#FFFFFF"><circle cx="18.6" cy="6.4" r="2.5"/><circle cx="22" cy="4.4" r="3"/><circle cx="25.4" cy="6.4" r="2.5"/></g><rect x="17.8" y="8.2" width="8.4" height="4.2" rx="1.2" fill="#FFFFFF" stroke="var(--line)" stroke-width="1.3"/></g></svg>
        <span class="wordmark">Stake <b>Chef</b></span>
        <span class="for-flr">FLR</span>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" id="tabStake" aria-selected="true" onclick="switchTab('stake')"></button>
        <button role="tab" id="tabDeleg" aria-selected="false" onclick="switchTab('delegate')"></button>
      </nav>
      <div class="lang-toggle" id="langToggle" onclick="switchLang()">
        <span id="langJA" class="active">JA</span>
        <span id="langEN">EN</span>
      </div>
</div></div>

<header class="hero">
  <div class="hero-in">
    <h1 class="catch" id="catch"></h1>
    <p class="lead" id="subtitle"></p>
  </div>
</header>

<main class="wrap">
 <div class="pane" id="paneStake">
 <div class="layout">
  <section class="panel">
    <div class="grid2">
      <div class="field">
        <label id="lbl_amount" for="amount"></label>
        <div class="iw">
          <input type="number" id="amount" min="50000" inputmode="numeric">
          <span class="unit">FLR</span>
        </div>
      </div>
      <div class="field">
        <label id="lbl_enddate"></label>
        <div class="cal-display" id="calDisplay" onclick="toggleCal()">
          <span id="calLabel"></span>
          <span class="cal-icon" aria-hidden="true">📅</span>
        </div>
      </div>
    </div>

    <div class="cal-popup" id="calPopup">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="moveMonth(-1)" aria-label="prev">&#8249;</button>
        <span class="cal-month-lbl" id="calMonthLbl"></span>
        <button class="cal-nav-btn" onclick="moveMonth(1)" aria-label="next">&#8250;</button>
      </div>
      <div class="cal-dow" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>

function switchLang(){
  lang = lang==='ja'?'en':'ja';
  localStorage.setItem('flr_lang', lang);
  applyLang();
  // Re-render results if search was performed
  if(document.getElementById('results').classList.contains('on')) render();
  if(document.getElementById('dResults').classList.contains('on')) renderDeleg();
  // Re-render dataDate if data was loaded
  if(NODES.length > 0) {
    document.getElementById('dataDate').textContent = T[lang].data_live(NODES.length);
  }
}

function applyLang(){
  const t = T[lang];
  document.getElementById('langJA').className = lang==='ja'?'active':'';
  document.getElementById('langEN').className = lang==='en'?'active':'';
  setHero();
  document.getElementById('tabStake').innerHTML = ICON_STEAK + '<span>' + t.tab_stake + '</span>';
  document.getElementById('tabDeleg').innerHTML = ICON_BEAR + '<span>' + t.tab_deleg + '</span>';
  document.querySelector('#emptyState .es-mark').innerHTML = ICON_STEAK;
  document.querySelector('#dEmptyState .es-mark').innerHTML = ICON_BEAR;
  document.getElementById('es_title').textContent = t.es_title;
  document.getElementById('es_list').innerHTML = t.es_items.map(i=>'<li>'+i+'</li>').join('');
  document.getElementById('d_es_title').textContent = t.d_es_title;
  document.getElementById('d_es_list').innerHTML = t.d_es_items.map(i=>'<li>'+i+'</li>').join('');
  document.getElementById('lbl_d_amount').innerHTML = t.lbl_d_amount;
  document.getElementById('amount').placeholder = t.ph_amount;
  document.getElementById('dAmount').placeholder = t.ph_d_amount;
  document.getElementById('d_cond_title').textContent = t.cond_title;
  document.getElementById('d_cond_list').innerHTML = t.d_cond_items.map(i=>'<li>'+i+'</li>').join('');
  document.getElementById('lbl_d_unnamed').innerHTML = t.lbl_d_unnamed;
  document.getElementById('dSearchBtn').textContent = t.d_btn;
  document.getElementById('d_rt_label').textContent = t.d_rt_label;
  document.documentElement.lang = lang;
  document.getElementById('lbl_amount').innerHTML = t.lbl_amount;
  document.getElementById('lbl_enddate').innerHTML = t.lbl_enddate;
  if(!selectedDate){
    document.getElementById('calLabel').textContent = t.cal_select;
  } else {
    // Re-render selected date label in current language
    const diff = daysFromToday(selectedDate);
    const mo = (selectedDate.getMonth()+1)+'';
    const da = selectedDate.getDate()+'';
    document.getElementById('calLabel').textContent =
      selectedDate.getFullYear()+'/'+mo.padStart(2,'0')+'/'+da.padStart(2,'0')+
      '\u3000'+t.cal_dur(diff);
  }
  document.getElementById('calHint').textContent = t.cal_hint;
  document.getElementById('calDow').innerHTML = t.cal_dow.map(d=>'<span>'+d+'</span>').join('');
  document.getElementById('cond_title').textContent = t.cond_title;
  document.getElementById('cond_list').innerHTML = t.cond_items.map(i=>'<li>'+i+'</li>').join('');
  document.getElementById('lbl_unnamed').innerHTML = t.lbl_unnamed;
  if(APR_META) showStaleWarning();
  document.getElementById('searchBtn').textContent = t.btn_search;
  document.getElementById('rt_label').textContent = t.rt_label;
  document.getElementById('credit').innerHTML = t.credit;
  document.getElementById('disc_label').textContent = t.disc_label;
  document.getElementById('disc_list').innerHTML = t.disc_items.map(item => {
    const isContact = item.endsWith('|contact');
    const text = item.replace('|contact','');
    return '<li'+(isContact?' class="disc-contact"':'')+'>'+text+'</li>';
  }).join('');

}

const STALE_DAYS = 8;

function formatEndDate(unixTs) {

// P-Chainの応答は約4MB（全委任者を含む）で2〜3秒かかる。条件を変えて検索し直すたびに
// 取り直さないよう、5分間は取得済みのデータを使い回す。
const CACHE_MS = 5 * 60 * 1000;
let loadedAt = 0;

async function loadValidatorData() {
  if (NODES.length && Date.now() - loadedAt < CACHE_MS) return true;
  try {
    /* ── Step 1: 実質APRデータを取得 ──
       Flare財団が公開する実支払記録から算出済み。委任者の手取り（手数料控除後）。
         apr = VRM(P-Chain検証報酬) + MIRROR(FTSOインフレ分)                        */
    const aprData = await loadAprData();
    const aprByNode = aprData.nodes || {};
    console.log('APR data: epochs', aprData.epochs, '/', Object.keys(aprByNode).length, 'nodes');

    /* ── Step 2: P-Chain APIからバリデータデータを取得 ── */
    const pResp = await fetch('https://flare-api.flare.network/ext/bc/P', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({jsonrpc:'2.0', method:'platform.getCurrentValidators', params:{}, id:1})
    });
    if (!pResp.ok) throw new Error('P-Chain HTTP ' + pResp.status);
    const pData = await pResp.json();
    if (!pData.result || !pData.result.validators) throw new Error('P-Chain invalid response');
    const rawValidators = pData.result.validators;

    /* ── Step 3: ノード単位でデータ構築 ── */
    const nowSec = Date.now() / 1000;
    NODES = [];

    for (const v of rawValidators) {
      const info = aprByNode[v.nodeID];
      // 報酬実績データが無いノード（新規など）はAPRを出せないので対象外。
      // 名称未登録のノードは残し、表示するかは検索時のチェックボックスで決める。
      if (!info) continue;

      const selfBond  = parseInt(v.weight) / 1e9;
      const delegated = parseInt(v.delegatorWeight || '0') / 1e9;
      const totalStake = selfBond + delegated;
      // 1ノードあたりの上限は self-bond の15倍、かつ 300M FLR
      // （200M → 300M は Granite ハードフォーク 2026-07-14 で引き上げ）
      const capacity  = Math.min(selfBond * 15, 300000000);
      const freeSpace = Math.max(capacity - totalStake, 0);

      const endTime  = parseInt(v.endTime);
      const daysLeft = Math.max(0, Math.floor((endTime - nowSec) / 86400));
      if (daysLeft <= 0) continue;

      // 報酬適格率: 直近の各エポックで実際に報酬対象になった割合。
      // P-Chainのuptimeは瞬間値なので、これが本当の「報酬をちゃんと出すか」の指標。
      const eligRate = info.observedEpochs
        ? info.eligibleEpochs / info.observedEpochs : 0;

      NODES.push({
        entity:  info.name,
        unnamed: !info.name,
        group:   info.entity,       // MIRRORを分け合う単位（FSPのvoter）
        apr:     info.apr,          // 手数料控除後（VRM + MIRROR）
        vrm:     info.vrm,
        mirror:  info.mirror,
        uptime:  parseFloat(v.uptime),
        fee:     parseFloat(v.delegationFee),
        eligOK:  info.eligibleEpochs,
        eligOf:  info.observedEpochs,
        eligRate: eligRate,
        freeM:   freeSpace / 1000000,
        freeFLR: Math.round(freeSpace),
        minDays: daysLeft,
        endDate: formatEndDate(endTime),
        fullNodeId: v.nodeID,
        stakeFLR: totalStake,
      });
    }

    // MIRRORはエンティティのプールを全ノードで分け合うので、希薄化の分母はエンティティ合計
    const groupStake = {};
    for (const n of NODES) {
      if (n.group) groupStake[n.group] = (groupStake[n.group] || 0) + n.stakeFLR;
    }
    for (const n of NODES) {
      n.poolStake = n.group ? groupStake[n.group] : n.stakeFLR;
    }

    NODES.sort((a,b) => b.apr - a.apr || b.freeFLR - a.freeFLR);

    loadedAt = Date.now();
    document.getElementById('dataDate').textContent = T[lang].data_live(NODES.length);
    showStaleWarning();
    console.log('Combined: P-Chain', rawValidators.length, '+ APR data →', NODES.length, 'nodes');
    return true;
  } catch(e) {
    console.error('Data fetch failed:', e);
    document.getElementById('dataDate').textContent = T[lang].data_fail(e.message);
    NODES = [];
    loadedAt = 0;
    return false;
  }
}

const MIN_DAYS = 14;
// 検証期間は最長365日なので、それより先を選んでも該当ノードは存在しない
const MAX_DAYS = 365;
const MIN_AMOUNT = 50000;

// ページを開いたまま日付をまたいでもずれないよう、毎回その時点の「今日」を使う
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysFromToday(d){ return Math.round((d - today()) / 86400000); }

let calYear = addDays(today(), MIN_DAYS).getFullYear();
let calMonth = addDays(today(), MIN_DAYS).getMonth();
let selectedDate = null;

function toggleCal(){
  document.getElementById('calPopup').classList.toggle('open');
  if(document.getElementById('calPopup').classList.contains('open')) renderCal();
}

function moveMonth(d){
  calMonth+=d;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCal();
}

function renderCal(){
  const t = T[lang];
  document.getElementById('calMonthLbl').textContent = (lang==='ja'? calYear+'年 '+t.cal_months[calMonth] : t.cal_months[calMonth]+' '+calYear);
  document.getElementById('calDow').innerHTML = t.cal_dow.map(d=>'<span>'+d+'</span>').join('');
  const grid = document.getElementById('calGrid');
  grid.innerHTML='';
  // 月曜始まり。前後の月の日付も埋めて、月末・月初（例: 10月表示中の11/1）も直接選べるようにする
  const first = new Date(calYear,calMonth,1);
  const lead = (first.getDay()+6)%7;
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const cells = Math.ceil((lead+daysInMonth)/7)*7;
  const t0 = today(), minD = addDays(t0, MIN_DAYS), maxD = addDays(t0, MAX_DAYS);
  for(let k=0;k<cells;k++){
    const dt=new Date(calYear,calMonth,1-lead+k);
    const other=dt.getMonth()!==calMonth;
    const d=document.createElement('button');
    const isDisabled=dt<minD||dt>maxD;
    const isToday=dt.getTime()===t0.getTime();
    const isSel=selectedDate&&dt.getTime()===selectedDate.getTime();
    d.className='cal-day'+(other?' other':'')+(isDisabled?' disabled':'')+(isToday?' today':'')+(isSel?' selected':'');
    d.textContent=(other&&dt.getDate()===1)?(dt.getMonth()+1)+'/1':dt.getDate();
    if(!isDisabled){
      d.onclick=()=>{ calYear=dt.getFullYear(); calMonth=dt.getMonth(); selectDate(dt); };
    } else {
      d.disabled=true;
    }
    grid.appendChild(d);
  }
}


function selectDate(dt){
  selectedDate=dt;
  const diff=daysFromToday(dt);
  const mo=(dt.getMonth()+1)+'';
  const da=dt.getDate()+'';
  document.getElementById('calLabel').textContent=
    dt.getFullYear()+'/'+mo.padStart(2,'0')+'/'+da.padStart(2,'0')+

const MIN_ELIG_RATE=0.75;   // 直近エポックのうち報酬対象だった割合の下限
const PORTAL_URL='https://portal.flare.network/staking';
const PORTAL_ROOT='https://portal.flare.network/';

async function go(){
  const amount=parseFloat(document.getElementById('amount').value);
  const duration=getDuration();
  const t = T[lang];
  if(!amount||amount<=0){alert(t.alert_amount);return;}
  if(amount<MIN_AMOUNT){alert(t.alert_min);return;}
  // 数日前に選んだ日付のまま開きっぱなしだと14日を切ることがある
  if(!duration||duration<MIN_DAYS||duration>MAX_DAYS){alert(t.alert_date);return;}
  const showUnnamed=document.getElementById('showUnnamed').checked;

  const btn=document.getElementById('searchBtn');
  btn.disabled=true;
  btn.textContent=t.btn_loading;
  document.getElementById('results').classList.remove('on');

  const ok = await loadValidatorData();

  btn.disabled=false;
  btn.textContent=t.btn_search;

  if(!ok || NODES.length === 0){
    document.getElementById('claimNote').classList.remove('on');
    document.getElementById('summary').textContent=t.fail_msg;
    document.getElementById('rc').textContent='0';
    document.getElementById('vlist').innerHTML='';
    document.getElementById('results').classList.add('on');
    return;
  }

  let filtered=NODES.filter(n=>{
    if(n.unnamed && !showUnnamed) return false;
    if(n.uptime<99) return false;
    // 報酬適格性: 直近エポックの1/4超を取りこぼしているノードは除外。
    // uptimeが100%でも報酬ゼロのバリデータが実在するため、uptimeだけでは足りない。
    if(n.eligRate<MIN_ELIG_RATE) return false;
    if(n.freeFLR<amount) return false;
    if(n.minDays<duration) return false;
    return true;
  });

  // 自分が入った後のAPRに補正する。
  // VRMはステーク比例なので不変。MIRRORはエンティティ単位の原資を全ノードのステークで分けるが、
  // ステークが増えると原資もかなり連動して増える（実測の弾力性 約0.8）ので、薄まるのは一部だけ。
  //   MIRROR後 = MIRROR現在 × ((エンティティ合計 + 自分の数量) / エンティティ合計)^(弾力性 - 1)
  const elasticity = (APR_META && APR_META.mirrorElasticity != null) ? APR_META.mirrorElasticity : 0.85;
  filtered.forEach(n=>{
    const dilution = Math.pow((n.poolStake + amount) / n.poolStake, elasticity - 1);
    n.mirrorAfter = n.mirror * dilution;
    n.aprAfter = n.vrm + n.mirrorAfter;
    n.dilutionPt = n.apr - n.aprAfter;
    n.rewardFLR = amount * n.aprAfter / 100 * duration / 365;
  });

  filtered.sort((a,b)=>{
    const aApr = a.aprAfter ?? -1;
    const bApr = b.aprAfter ?? -1;
    if(bApr!==aApr) return bApr-aApr;
    return b.freeFLR-a.freeFLR;
  });

  // フィルタ結果を保持して段階表示
  lastFiltered = filtered;
  lastAmount = amount;
  lastDuration = duration;
  showCount = 10;

  render();
  document.getElementById('emptyState').classList.add('off');
  scrollToResultsIfNarrow('results');
}

// rank: 全体での順位(0始まり) / delayIdx: 今回追加した中での順番（アニメーションの遅延用）
function buildCard(n, rank, delayIdx, t){
  const d=document.createElement('div');
  d.className='vc'+(rank===0?' best':'');
  d.style.animationDelay=(delayIdx*.06)+'s';

  // Portalの検索は「NodeID-」付きやフルIDではヒットせず、本体の先頭12文字なら通る。
  // コピーはその12文字、下にフルIDを小さく出して、検索結果との照合に使ってもらう。
  const idBody = n.fullNodeId.replace(/^NodeID-/, '');
  const searchId = idBody.slice(0, 12);
  const freeDisp=n.freeM>=1?n.freeM.toFixed(1)+'M':
                 n.freeM>=0.01?Math.round(n.freeM*1000)+'K':
                 n.freeFLR.toLocaleString()+' FLR';

  const feeCls = n.fee<=9?'to':n.fee<=12?'tb':'';
  const uptimeCls = n.uptime>=99.9?'tg':n.uptime>=99?'tb':'tr';
  const freeCls = n.freeM>=100?'tg':n.freeM>=10?'tb':n.freeM>=1?'':'tr';
  const eligCls = n.eligRate>=1?'tg':n.eligRate>=MIN_ELIG_RATE?'tb':'tr';
  const pills =
    (n.unnamed ? '<span class="tag tu">'+t.pill_unnamed+'</span>' : '')+
    '<span class="tag '+feeCls+'">'+t.pill_fee(n.fee)+'</span>'+
    '<span class="tag '+uptimeCls+'">'+t.pill_uptime(n.uptime)+'</span>'+
    '<span class="tag '+eligCls+'">'+t.pill_elig(n.eligOK, n.eligOf)+'</span>'+
    '<span class="tag">'+esc(t.ends(n.endDate, n.minDays))+'</span>'+
    '<span class="tag '+freeCls+'">'+t.pill_free(freeDisp)+'</span>';

  // 実質APRの内訳（ステーキング報酬とMIRROR）を横棒の比率で見せる
  const total = n.vrm + n.mirrorAfter;
  const vPct = total > 0 ? (n.vrm / total * 100) : 100;

  d.innerHTML=
    '<div class="vhd">'+
      '<div class="rb">'+(rank+1)+'</div>'+
      '<div class="vname">'+esc(n.unnamed ? t.unnamed_name : n.entity)+'</div>'+
      (n.mirror > 0 ? '<span class="mb" title="'+t.mirror_tip(n.mirrorAfter)+'">MIRROR</span>' : '')+
    '</div>'+
    '<div class="aprrow">'+
      '<div>'+
        '<div class="apr num" title="'+t.apr_tip(n.vrm, n.mirrorAfter, n.dilutionPt)+'">'+n.aprAfter.toFixed(1)+'<small>%</small></div>'+
        '<div class="apr-lbl">'+t.apr_label+'</div>'+
      '</div>'+
      '<div class="est">'+t.est_label(lastDuration)+'<b class="num">≈ '+Math.round(n.rewardFLR).toLocaleString()+' FLR</b></div>'+
    '</div>'+
    '<div class="bar-cap">'+t.bar_cap+'</div>'+
    '<div class="bar" aria-hidden="true"><i class="bv" style="width:'+vPct.toFixed(1)+'%"></i><i class="bm" style="width:'+(100-vPct).toFixed(1)+'%"></i></div>'+
    '<div class="leg"><span class="lv">'+t.leg_vrm+' '+n.vrm.toFixed(1)+'%</span>'+
      (n.mirrorAfter > 0 ? '<span class="plus">＋</span><span class="lm">'+t.leg_mirror+' '+n.mirrorAfter.toFixed(1)+'%</span>' : '')+'</div>'+
    '<div class="tags">'+pills+'</div>'+
    '<div class="node-block-label"><span>'+t.node_label+'</span>'+
      '<a href="'+PORTAL_URL+'" target="_blank" rel="noopener">'+t.portal_link+'</a></div>'+
    '<div class="node-id-row">'+
      '<div class="node-id-text">'+esc(searchId)+'</div>'+
      '<button class="copy-btn">'+t.copy+'</button>'+
    '</div>'+
    '<div class="node-full">'+t.node_full+' '+esc(n.fullNodeId)+'</div>';
  const btn = d.querySelector('.copy-btn');
  btn.addEventListener('click', ()=>copyNode(searchId, btn));
  d.querySelector('.node-id-text').addEventListener('click', ()=>copyNode(searchId, btn));
  return d;
}

function render(){
  const t = T[lang];
  const list=document.getElementById('vlist');
  list.innerHTML='';
  renderMeta(t);

  const note=document.getElementById('claimNote');
  note.innerHTML='<summary>'+t.claim_note_title+'</summary><p>'+esc(t.claim_note)+'</p>';
  note.classList.toggle('on', lastFiltered.length>0);

  if(!lastFiltered.length){
    list.innerHTML='<p class="none-msg">'+t.none_msg+'</p>';
  } else {
    appendCards(list, 0, showCount, t);
    renderMoreButton(list, t);
  }
  document.getElementById('results').classList.add('on');
}

/* ── デリゲート（WFLRの委任先） ── */
let dFiltered = [], dAmount = 0, dShowCount = 10;

function fmtM(m){ return m >= 1000 ? (m/1000).toFixed(2)+'B' : m >= 1 ? m.toFixed(1)+'M' : Math.round(m*1000)+'K'; }

async function goDeleg(){
  const t = T[lang];
  const amount = parseFloat(document.getElementById('dAmount').value);
  if (!amount || amount <= 0) { alert(t.d_alert_amount); return; }
  const btn = document.getElementById('dSearchBtn');
  btn.disabled = true; btn.textContent = t.btn_loading;
  let meta;
  try { meta = await loadAprData(); }
  catch(e) {
    document.getElementById('dDataNote').textContent = t.data_fail(e.message);
    btn.disabled = false; btn.textContent = t.d_btn;
    return;
  }
  btn.disabled = false; btn.textContent = t.d_btn;

  const showUnnamed = document.getElementById('dShowUnnamed').checked;
  // 自分の委任で委任総額が増えたときの薄まり。原資の連動度(弾力性)は build-apr.py が実測
  const beta = meta.wnatElasticity != null ? meta.wnatElasticity : 0.9;
  dFiltered = Object.entries(meta.providers || {})
    .map(([voter, p]) => Object.assign({voter}, p))
    .filter(p => p.observedEpochs && p.paidEpochs / p.observedEpochs >= MIN_ELIG_RATE && (showUnnamed || p.name))
    .map(p => {
      const W = p.delegatedM * 1e6;
      const aprAfter = W > 0 ? p.apr * Math.pow((W + amount) / W, beta - 1) : p.apr;
      return Object.assign(p, {aprAfter, est30: amount * aprAfter / 100 * 30 / 365});
    })
    .sort((a, b) => b.aprAfter - a.aprAfter || b.delegatedM - a.delegatedM);
  dAmount = amount; dShowCount = 10;
  document.getElementById('dDataNote').textContent = t.d_data_note(meta.epochs, fmtMD(meta.generatedAt));
  renderDeleg();
  document.getElementById('dEmptyState').classList.add('off');
  scrollToResultsIfNarrow('dResults');
}

function renderDeleg(){
  const t = T[lang];
  const list = document.getElementById('dList');
  list.innerHTML = '';
  const total = dFiltered.length, shown = Math.min(dShowCount, total);
  document.getElementById('dRc').textContent = t.rc(shown, total);
  document.getElementById('dSummary').textContent =
    t.d_summary(dAmount.toLocaleString(), total, Object.keys(APR_META.providers || {}).length, APR_META.medianApr.toFixed(1));
  const note = document.getElementById('dNote');
  note.innerHTML = '<summary>'+t.d_note_title+'</summary><p>'+esc(t.d_note)+'</p>';
  note.classList.toggle('on', total > 0);
  if (!total) {
    list.innerHTML = '<p class="none-msg">'+t.none_msg+'</p>';
  } else {
    dFiltered.slice(0, dShowCount).forEach((p, i) => list.appendChild(buildDelegCard(p, i, i, t)));
    if (total > dShowCount) {
      const more = document.createElement('button');
      more.className = 'more-btn';
      more.textContent = t.more(Math.min(total - dShowCount, 10), total - dShowCount);
      more.onclick = () => { dShowCount += 10; renderDeleg(); };
      list.appendChild(more);
    }
  }
  document.getElementById('dResults').classList.add('on');
}

function buildDelegCard(p, rank, delayIdx, t){
  const d = document.createElement('div');
  d.className = 'vc' + (rank === 0 ? ' best' : '');
  d.style.animationDelay = (delayIdx * .04) + 's';
  const paidCls = p.paidEpochs >= p.observedEpochs ? 'tg' : 'tb';
  const pills =
    (p.name ? '' : '<span class="tag tu">'+t.pill_unnamed+'</span>')+
    '<span class="tag">'+t.pill_fee(p.fee)+'</span>'+
    '<span class="tag '+paidCls+'">'+t.pill_elig(p.paidEpochs, p.observedEpochs)+'</span>'+
    '<span class="tag">'+t.d_pill_deleg(fmtM(p.delegatedM))+'</span>';
  d.innerHTML =
    '<div class="vhd"><div class="rb">'+(rank+1)+'</div>'+
      '<div class="vname">'+esc(p.name || t.unnamed_name)+'</div></div>'+
    '<div class="aprrow">'+
      '<div><div class="apr num">'+p.aprAfter.toFixed(2)+'<small>%</small></div>'+
      '<div class="apr-lbl">'+t.apr_label+'</div></div>'+
      '<div class="est">'+t.d_est_label+'<b class="num">≈ '+Math.round(p.est30).toLocaleString()+' FLR</b></div>'+
    '</div>'+
    '<div class="tags">'+pills+'</div>'+
    '<div class="node-block-label"><span>'+t.d_node_label+'</span>'+
      '<a href="'+PORTAL_ROOT+'" target="_blank" rel="noopener">'+t.portal_link+'</a></div>'+
    '<div class="node-id-row"><div class="node-id-text addr">'+esc(p.delegationAddress)+'</div>'+
      '<button class="copy-btn">'+t.copy+'</button></div>';
  const btn = d.querySelector('.copy-btn');
  btn.addEventListener('click', () => copyNode(p.delegationAddress, btn));
  d.querySelector('.node-id-text').addEventListener('click', () => copyNode(p.delegationAddress, btn));
  return d;
}

applyLang();
if (location.hash === '#delegate') switchTab('delegate');
